# Batch inference & Haar-state verification config (Section 6)
output_dir: "outputs/infer"
data_path: "data/gates_20_100/test"
vocab_path: "assets/vocab.txt"
checkpoint: ""

seed: 42
probe_seed: 0
max_num_qubits: 20
dropout: 0.0
choice_graph_mode: null

batch_size: 32
validation_size: 9000
num_sample_per_seq: 8
sampler_chunk_size: 8
temperature: 0.2
top_k: 0
top_p: 1.0

inference: true
verify_circuit: true
certify_zx: false
fidelity_tolerance: 1.0e-4
verify_num_workers: 16

defaults:
  - model: gnn_transformer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  output_subdir: null
  run:
    dir: ${output_dir}
  job:
    chdir: false
