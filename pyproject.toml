[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graftq"
version = "0.1.0"
description = "GraftQ: Inference Code and Pretrained Checkpoints for Multimodal Generative Quantum Circuit Optimization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later OR LicenseRef-GraftQ-Commercial" }
authors = [
  { name = "Xiaodi Li", email = "lixiaodi@fudan.edu.cn" },
  { name = "Linghui Chen", email = "chenlh@mail.ustc.edu.cn" },
  { name = "Tao Zhang", email = "tao_zhang@mail.tsinghua.edu.cn" },
]
keywords = [
  "quantum-computing",
  "quantum-circuit-optimization",
  "zx-calculus",
  "graph-neural-networks",
  "transformer",
]
dependencies = [
  "torch>=2.4.0",
  "torch-geometric>=2.5.0",
  "safetensors>=0.4.0",
  "numpy>=1.26.0",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "webdataset>=0.2.86",
  "braceexpand>=0.1.7",
  "qulacs>=0.6.12",
  "pyzx>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["src*"]
